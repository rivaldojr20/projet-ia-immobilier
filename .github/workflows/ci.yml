name: CI - Tests de l'API

# Déclenchement : à chaque push ou pull request sur la branche main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installation de Python
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Installation des dépendances
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Exécution des tests
      - name: Lancer les tests avec pytest
        run: |
          pytest -v
  build-docker:
    runs-on: ubuntu-latest
    needs: test # Ce job ne se lance que si les tests (job précédent) réussissent

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t prediction-immobilier-api .
